<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabsOmar - AI Creative Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 0% 0%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            filter: brightness(1.1);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .token-badge {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        input, textarea, select {
            background: rgba(2, 6, 23, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }

        input:focus {
            outline: none !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3) !important;
        }

        .tab-active {
            background: rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
            color: white;
        }

        /* Modern Audio Player Customization */
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #6366f1;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="gradient-bg"></div>

    <!-- AUTH SECTION -->
    <div id="authContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="glass-card w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8 text-indigo-400"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold">LabsOmar Studio</h2>
                <p id="authSubtitle" class="text-slate-400 text-sm mt-2">Prihláste sa cez @LabsOmar.com</p>
            </div>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Vaša adresa</label>
                    <div class="relative flex items-center">
                        <input type="text" id="emailPrefix" placeholder="meno" required
                               class="w-full pl-4 pr-32 py-3 rounded-xl focus:outline-none transition-all">
                        <span class="absolute right-4 text-slate-500 font-medium pointer-events-none">@LabsOmar.com</span>
                    </div>
                </div>
                <div id="passwordField">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Heslo</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required
                           class="w-full px-4 py-3 rounded-xl focus:outline-none transition-all">
                </div>
                
                <button type="submit" id="authSubmitBtn" class="w-full btn-primary text-white font-bold py-3 rounded-xl shadow-lg mt-4">
                    Vstúpiť do štúdia
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="toggleAuthMode" class="text-sm text-indigo-400 hover:text-indigo-300 font-medium">
                    Nemáte účet? Zaregistrujte sa
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appContainer" class="max-w-6xl mx-auto opacity-0 transition-opacity duration-500">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-500/20">
                    <i data-lucide="brain-circuit" class="w-8 h-8 text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">LabsOmar <span class="text-indigo-400 text-lg font-medium">Creative Studio</span></h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="userBadge" class="text-xs font-medium text-slate-400">neprihlásený</span>
                        <button id="logoutBtn" class="text-[10px] text-red-400 hover:underline">Odhlásiť</button>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-1">
                <div class="flex items-center gap-3">
                    <div class="token-badge px-4 py-2 rounded-full flex items-center gap-2 shadow-sm">
                        <i data-lucide="coins" class="w-4 h-4"></i>
                        <span id="tokenDisplay" class="font-bold">20,000</span>
                        <span class="text-[10px] opacity-70">TOKENOV</span>
                    </div>
                    <button id="toggleSettings" class="p-3 glass-card hover:bg-slate-800 transition-colors">
                        <i data-lucide="settings-2" class="w-5 h-5 text-slate-300"></i>
                    </button>
                </div>
                <div id="refillCountdown" class="text-[10px] text-slate-500 font-medium uppercase tracking-wider mr-14">
                    Obnova o: --:--:--
                </div>
            </div>
        </header>

        <!-- Provider Selection -->
        <div class="flex justify-center mb-10">
            <div class="glass-card p-1.5 flex gap-2">
                <button id="providerLoomo" class="tab-active px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all">
                    <i data-lucide="layers" class="w-4 h-4"></i> LoomoAI
                </button>
                <button id="providerBehen" class="px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-slate-400 hover:text-white">
                    <i data-lucide="stars" class="w-4 h-4"></i> BehenAI
                </button>
            </div>
        </div>

        <!-- API Settings Panel -->
        <div id="settingsPanel" class="hidden mb-8 glass-card p-6 border-indigo-500/30">
            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                <i data-lucide="key-round" class="w-5 h-5 text-indigo-400"></i>
                Konfigurácia Studio kľúčov
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">LoomoAI API Key</label>
                    <input type="password" id="loomoKeyInput" placeholder="Vložte LoomoAI kľúč" 
                           class="w-full px-4 py-3 rounded-xl focus:outline-none">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">BehenAI API Key</label>
                    <input type="password" id="behenKeyInput" placeholder="Vložte BehenAI API kľúč" 
                           class="w-full px-4 py-3 rounded-xl focus:outline-none">
                </div>
            </div>
            <button id="saveSettings" class="mt-6 w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition-all">
                Uložiť všetky nastavenia
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Side: Inputs -->
            <div class="lg:col-span-8 space-y-6">
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <div id="providerIndicator" class="flex items-center gap-2 text-indigo-400 font-semibold uppercase text-xs tracking-widest">
                            <i data-lucide="type" class="w-4 h-4"></i>
                            Režim LoomoAI
                        </div>
                        <div id="costIndicator" class="text-xs text-slate-500 italic">Cena: 0 tokenov</div>
                    </div>
                    <textarea id="textInput" rows="10" 
                              class="w-full p-6 rounded-2xl text-lg leading-relaxed focus:outline-none custom-scrollbar resize-none"
                              placeholder="Sem napíšte text na prečítanie..."></textarea>
                    <div class="flex justify-between mt-4">
                        <span id="charCount" class="text-sm text-slate-500 font-medium">0 / 5000 znakov</span>
                        <button id="clearText" class="text-xs text-slate-400 hover:text-white transition-colors">Vymazať</button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Voices & Actions -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-6">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                        <i data-lucide="mic-2" class="w-4 h-4"></i>
                        Výber hlasu
                    </h2>
                    <div class="relative mb-6">
                        <select id="voiceSelect" class="w-full p-4 rounded-xl appearance-none cursor-pointer pr-10">
                            <option value="">Načítavam...</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-5 w-4 h-4 text-slate-500 pointer-events-none"></i>
                    </div>

                    <button id="generateBtn" class="w-full btn-primary text-white font-black py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                        VYGENEROVAŤ AUDIO
                    </button>
                </div>

                <!-- Modern Result Card & Player -->
                <div id="resultCard" class="hidden glass-card p-6 border-indigo-500/30 overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <div class="flex items-center justify-between mb-6">
                        <span id="playerStatus" class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Súbor pripravený</span>
                        <span class="text-[10px] text-slate-500" id="timestamp">teraz</span>
                    </div>

                    <!-- Custom Player UI -->
                    <div class="bg-slate-900/50 p-4 rounded-2xl space-y-4">
                        <div class="flex items-center gap-4">
                            <button id="customPlayBtn" class="w-12 h-12 flex items-center justify-center rounded-full bg-indigo-600 hover:bg-indigo-500 transition-colors">
                                <i data-lucide="play" id="playIcon" class="w-5 h-5 text-white"></i>
                            </button>
                            <div class="flex-1 space-y-1">
                                <input type="range" id="audioProgress" class="w-full" value="0" step="0.1">
                                <div class="flex justify-between text-[10px] font-mono text-slate-500">
                                    <span id="currentTime">0:00</span>
                                    <span id="durationTime">0:00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <audio id="audioPlayer" class="hidden"></audio>
                    
                    <div class="grid grid-cols-2 gap-3 mt-6">
                         <a id="downloadBtn" href="#" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold transition-all">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            STIAHNUŤ
                        </a>
                        <button id="shareBtn" class="flex items-center justify-center gap-2 py-3 bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 rounded-xl text-xs font-bold hover:bg-indigo-600/20 transition-all">
                            <i data-lucide="share-2" class="w-4 h-4"></i>
                            ZDIEĽAŤ
                        </button>
                    </div>
                </div>

                <div id="statusMessage" class="hidden p-4 rounded-2xl text-xs font-medium border animate-pulse"></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const INITIAL_TOKENS = 20000;
        const REFILL_INTERVAL = 24 * 60 * 60 * 1000;
        const DOMAIN = "@LabsOmar.com";

        const BEHEN_VOICES = [
            "Zephyr", "Puck", "Charon", "Kore", "Fenrir", "Leda", "Orus", 
            "Aoede", "Callirrhoe", "Autonoe", "Enceladus", "Iapetus", 
            "Umbriel", "Algieba", "Despina", "Erinome", "Algenib", 
            "Rasalgethi", "Laomedeia", "Achernar", "Alnilam", "Schedar", 
            "Gacrux", "Pulcherrima", "Achird", "Zubenelgenubi", 
            "Vindemiatrix", "Sadachbia", "Sadaltager", "Sulafat"
        ];

        const state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('labs_omar_users') || '[]'),
            loomoKey: localStorage.getItem('labs_omar_loomo_key') || '',
            behenKey: localStorage.getItem('labs_omar_behen_key') || '',
            activeProvider: 'loomo',
            isGenerating: false,
            mode: 'login'
        };

        const elements = {
            auth: document.getElementById('authContainer'),
            app: document.getElementById('appContainer'),
            tokenDisplay: document.getElementById('tokenDisplay'),
            userBadge: document.getElementById('userBadge'),
            refillCountdown: document.getElementById('refillCountdown'),
            generateBtn: document.getElementById('generateBtn'),
            resultCard: document.getElementById('resultCard'),
            audioPlayer: document.getElementById('audioPlayer'),
            downloadBtn: document.getElementById('downloadBtn'),
            textInput: document.getElementById('textInput'),
            statusMessage: document.getElementById('statusMessage'),
            voiceSelect: document.getElementById('voiceSelect'),
            providerIndicator: document.getElementById('providerIndicator'),
            settingsPanel: document.getElementById('settingsPanel'),
            loomoKeyInput: document.getElementById('loomoKeyInput'),
            behenKeyInput: document.getElementById('behenKeyInput'),
            // Custom Player
            customPlayBtn: document.getElementById('customPlayBtn'),
            playIcon: document.getElementById('playIcon'),
            audioProgress: document.getElementById('audioProgress'),
            currentTime: document.getElementById('currentTime'),
            durationTime: document.getElementById('durationTime'),
            playerStatus: document.getElementById('playerStatus')
        };

        // PREPÍNANIE PROVIDEROV
        document.getElementById('providerLoomo').addEventListener('click', () => switchProvider('loomo'));
        document.getElementById('providerBehen').addEventListener('click', () => switchProvider('behen'));

        function switchProvider(p) {
            state.activeProvider = p;
            const isLoomo = p === 'loomo';
            
            document.getElementById('providerLoomo').className = isLoomo ? 'tab-active px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all' : 'px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-slate-400 hover:text-white';
            document.getElementById('providerBehen').className = !isLoomo ? 'tab-active px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all' : 'px-6 py-2.5 rounded-xl font-bold flex items-center gap-2 transition-all text-slate-400 hover:text-white';
            
            elements.providerIndicator.innerHTML = isLoomo ? '<i data-lucide="layers" class="w-4 h-4"></i> Režim LoomoAI' : '<i data-lucide="stars" class="w-4 h-4"></i> Režim BehenAI';
            lucide.createIcons();
            
            loadVoices();
        }

        function saveUsers() { localStorage.setItem('labs_omar_users', JSON.stringify(state.users)); }

        function checkRefill() {
            if (!state.currentUser) return;
            const now = Date.now();
            const last = state.currentUser.lastRefill || now;
            if (now - last >= REFILL_INTERVAL) {
                state.currentUser.tokens = INITIAL_TOKENS;
                state.currentUser.lastRefill = now;
                syncUser();
                showStatus('Kredity boli obnovené!', 'success');
            }
            updateCountdown();
        }

        function updateCountdown() {
            if (!state.currentUser) return;
            const remaining = (state.currentUser.lastRefill + REFILL_INTERVAL) - Date.now();
            if (remaining <= 0) { elements.refillCountdown.innerText = "Obnova pripravená"; return; }
            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            elements.refillCountdown.innerText = `Obnova o: ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function syncUser() {
            const idx = state.users.findIndex(u => u.email === state.currentUser.email);
            if (idx !== -1) {
                state.users[idx] = state.currentUser;
                saveUsers();
                localStorage.setItem('labs_omar_current_session', JSON.stringify(state.currentUser));
                elements.tokenDisplay.innerText = state.currentUser.tokens.toLocaleString();
            }
        }

        async function loadVoices() {
            elements.voiceSelect.innerHTML = '<option>Načítavam...</option>';
            
            if (state.activeProvider === 'behen') {
                elements.voiceSelect.innerHTML = BEHEN_VOICES.map(v => `<option value="${v}">${v}</option>`).join('');
                return;
            }

            if (!state.loomoKey) {
                elements.voiceSelect.innerHTML = '<option value="">Chýba kľúč k LoomoAI</option>';
                return;
            }

            try {
                const res = await fetch('https://api.elevenlabs.io/v1/voices', {
                    headers: { 'xi-api-key': state.loomoKey }
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                elements.voiceSelect.innerHTML = data.voices.map(v => `<option value="${v.voice_id}">${v.name}</option>`).join('');
            } catch (e) {
                elements.voiceSelect.innerHTML = '<option value="">Chyba načítania hlasov</option>';
            }
        }

        elements.generateBtn.addEventListener('click', async () => {
            const text = elements.textInput.value.trim();
            const voiceId = elements.voiceSelect.value;
            const cost = text.length;

            if (cost < 2) return showStatus('Zadajte text.', 'error');
            if (!voiceId) return showStatus('Vyberte hlas.', 'error');
            if (state.currentUser.tokens < cost) return showStatus('Nedostatok tokenov.', 'error');

            checkRefill();
            setLoading(true);

            try {
                if (state.activeProvider === 'loomo') {
                    await runLoomo(text, voiceId, cost);
                } else {
                    await runBehen(text, voiceId, cost);
                }
            } catch (e) {
                showStatus(e.message, 'error');
            } finally {
                setLoading(false);
            }
        });

        async function runLoomo(text, voiceId, cost) {
            if (!state.loomoKey) throw new Error('Chýba LoomoAI kľúč.');
            const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                method: 'POST',
                headers: { 'xi-api-key': state.loomoKey, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    model_id: 'eleven_multilingual_v2',
                    voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                })
            });
            if (!res.ok) throw new Error('LoomoAI API chyba.');
            const blob = await res.blob();
            setupAudio(blob, cost);
        }

        async function runBehen(text, voiceId, cost) {
            if (!state.behenKey) throw new Error('Chýba BehenAI kľúč.');
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceId } } }
                }
            };
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${state.behenKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('BehenAI API chyba.');
            const data = await res.json();
            const pcmBase64 = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            if (!pcmBase64) throw new Error('Dáta z BehenAI neprišli.');
            const binaryString = window.atob(pcmBase64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const wavBlob = pcmToWav(bytes.buffer, 24000);
            setupAudio(wavBlob, cost);
        }

        function pcmToWav(buffer, sampleRate) {
            const length = buffer.byteLength;
            const wav = new Uint8Array(44 + length);
            const view = new DataView(wav.buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) wav[offset + i] = string.charCodeAt(i);
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length, true);
            wav.set(new Uint8Array(buffer), 44);
            return new Blob([wav], { type: 'audio/wav' });
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function setupAudio(blob, cost) {
            const url = URL.createObjectURL(blob);
            elements.audioPlayer.src = url;
            elements.downloadBtn.href = url;
            elements.resultCard.classList.remove('hidden');
            state.currentUser.tokens -= cost;
            syncUser();
            showStatus('Audio pripravené!', 'success');
            document.getElementById('timestamp').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Reset player UI
            elements.audioProgress.value = 0;
            elements.currentTime.innerText = "0:00";
            elements.playIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
        }

        // PLAYER LOGIC
        elements.customPlayBtn.addEventListener('click', () => {
            if (elements.audioPlayer.paused) {
                elements.audioPlayer.play();
                elements.playIcon.setAttribute('data-lucide', 'pause');
            } else {
                elements.audioPlayer.pause();
                elements.playIcon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        });

        elements.audioPlayer.addEventListener('loadedmetadata', () => {
            elements.durationTime.innerText = formatTime(elements.audioPlayer.duration);
            elements.audioProgress.max = elements.audioPlayer.duration;
        });

        elements.audioPlayer.addEventListener('timeupdate', () => {
            elements.audioProgress.value = elements.audioPlayer.currentTime;
            elements.currentTime.innerText = formatTime(elements.audioPlayer.currentTime);
        });

        elements.audioProgress.addEventListener('input', () => {
            elements.audioPlayer.currentTime = elements.audioProgress.value;
        });

        elements.audioPlayer.addEventListener('ended', () => {
            elements.playIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
        });

        function setLoading(l) {
            elements.generateBtn.disabled = l;
            elements.generateBtn.innerHTML = l ? `<div class="loader"></div>` : `<i data-lucide="play" class="w-5 h-5"></i> VYGENEROVAŤ AUDIO`;
            if(!l) lucide.createIcons();
        }

        function showStatus(msg, type) {
            elements.statusMessage.innerText = msg;
            elements.statusMessage.className = `p-4 rounded-2xl text-xs font-medium border animate-pulse ${type === 'error' ? 'border-red-500 text-red-400' : 'border-indigo-500 text-indigo-400'}`;
            elements.statusMessage.classList.remove('hidden');
            setTimeout(() => elements.statusMessage.classList.add('hidden'), 5000);
        }

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailPrefix').value.trim() + DOMAIN;
            const pass = document.getElementById('authPassword').value;
            
            if (state.mode === 'register') {
                const user = { email, password: pass, tokens: INITIAL_TOKENS, lastRefill: Date.now() };
                state.users.push(user);
                saveUsers();
                state.currentUser = user;
            } else {
                const user = state.users.find(u => u.email === email && u.password === pass);
                if (!user) return showStatus('Nesprávne údaje.', 'error');
                state.currentUser = user;
            }
            
            localStorage.setItem('labs_omar_current_session', JSON.stringify(state.currentUser));
            elements.auth.classList.add('hidden');
            elements.app.classList.remove('opacity-0');
            elements.userBadge.innerText = state.currentUser.email;
            elements.tokenDisplay.innerText = state.currentUser.tokens.toLocaleString();
            checkRefill();
            loadVoices();
        });

        document.getElementById('toggleSettings').addEventListener('click', () => elements.settingsPanel.classList.toggle('hidden'));
        
        document.getElementById('saveSettings').addEventListener('click', () => {
            state.loomoKey = elements.loomoKeyInput.value.trim();
            state.behenKey = elements.behenKeyInput.value.trim();
            localStorage.setItem('labs_omar_loomo_key', state.loomoKey);
            localStorage.setItem('labs_omar_behen_key', state.behenKey);
            showStatus('Kľúče LoomoAI a BehenAI boli uložené!', 'success');
            loadVoices();
            elements.settingsPanel.classList.add('hidden');
        });

        document.getElementById('toggleAuthMode').addEventListener('click', () => {
            state.mode = state.mode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').innerText = state.mode === 'login' ? 'LabsOmar Studio' : 'Nová registrácia';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('labs_omar_current_session');
            location.reload();
        });

        elements.textInput.addEventListener('input', () => {
            const len = elements.textInput.value.length;
            document.getElementById('charCount').innerText = `${len} / 5000 znakov`;
            document.getElementById('costIndicator').innerText = `Cena: ${len} tokenov`;
        });

        setInterval(checkRefill, 1000);

        window.onload = () => {
            const session = localStorage.getItem('labs_omar_current_session');
            elements.loomoKeyInput.value = state.loomoKey;
            elements.behenKeyInput.value = state.behenKey;
            if (session) {
                state.currentUser = JSON.parse(session);
                elements.auth.classList.add('hidden');
                elements.app.classList.remove('opacity-0');
                elements.userBadge.innerText = state.currentUser.email;
                elements.tokenDisplay.innerText = state.currentUser.tokens.toLocaleString();
                checkRefill();
                loadVoices();
            } else {
                elements.auth.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
